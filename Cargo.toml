[package]
name = "sqllogictest-flightsql"
version = "0.3.0"
edition = "2024"
authors = ["lewiszlw <lewiszlw520@gmail.com>"]
description = "A sqllogictest runner for Flight SQL protocol supported databases"
keywords = ["sqllogictest", "SQL", "database", "flightsql"]
repository = "https://github.com/systemxlabs/sqllogictest-flightsql"
homepage = "https://github.com/systemxlabs/sqllogictest-flightsql"
license = "MIT"
readme = "README.md"

[dependencies]
arrow = "60"
arrow-flight = { version = "60", features = ["flight-sql"] }
async-trait = "0.1"
bigdecimal = "0.4.8"
futures = "0.3"
half = { version = "2.7.0" }
itertools = "0.14"
sqllogictest = "0.29.1"
thiserror = "2.0"
tonic = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
